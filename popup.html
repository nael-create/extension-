<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: sans-serif; padding: 10px; }
    h3 { margin-top: 0; }
    label { font-size: 12px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; margin: 5px 0 15px; padding: 5px; }
    button { width: 100%; padding: 10px; background: #1877F2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #ccc; }
    #status { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
  </style>
</head>
<body>
  <h3>WTB Facebook Scanner</h3>
  
  <label for="webhookUrl">URL Google Apps Script (Sheet)</label>
  <input type="text" id="webhookUrl" placeholder="https://script.google.com/macros/s/.../exec">
  
  <button id="scanBtn">Scraper ce groupe</button>
  <button id="dashboardBtn" style="background:#42b72a; margin-top:8px;">Ouvrir le dashboard</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
